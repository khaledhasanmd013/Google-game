name: Build 3D Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
      env:
        HOME: /root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p /root/.android
          rm -f /root/.android/debug.keystore
          keytool -genkey -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          mkdir -p /root/.local/share/godot/export_templates/4.2.2.stable
          if [ ! -f /root/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk ]; then
            curl -L -o templates.tpz https://github.com
            unzip -q templates.tpz -d temp_templates
            mv temp_templates/templates/* /root/.local/share/godot/export_templates/4.2.2.stable/
            rm -rf templates.tpz temp_templates
          fi

          cat << 'EOF' > set_sdk.gd
          @tool
          extends EditorScript
          func _run():
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/java_sdk_path", "/usr/lib/jvm/java-17-openjdk-amd64")
              settings.set_setting("export/android/android_sdk_path", "/usr/lib/android-sdk")
              settings.set_setting("export/android/debug_keystore", "/root/.android/debug.keystore")
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              print("SDK PATHS SAVED SUCCESSFULLY!")
          EOF
          godot --headless --editor --script set_sdk.gd --quit
          rm -f set_sdk.gd

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Turbo3DRacing.apk

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-3D-Racing-APK
          path: build/Turbo3DRacing.apk
          retention-days: 30
