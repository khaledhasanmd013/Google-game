name: Build Turbo 3D Racing Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: ""

      - name: Install Android Packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Setup Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/godot"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip" \
            -o godot.zip

          unzip -oq godot.zip -d "$HOME/godot"

          GODOT_BIN="$HOME/godot/Godot_v4.2.2-stable_linux.x86_64"

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          echo "$HOME/godot" >> "$GITHUB_PATH"

          "$GODOT_BIN" --version

      - name: Install Android Export Templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.2.2.stable"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz" \
            -o templates.tpz

          mkdir -p templates
          unzip -oq templates.tpz -d templates

          cp -a templates/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      - name: Setup Debug Keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP"

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          "$GODOT_BIN" --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$JAVA_HOME/bin/java"
          test -f "$RUNNER_TEMP/debug.keystore"

      - name: Import Godot Project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            build/Turbo3DRacing.apk

          test -s build/Turbo3DRacing.apk

          echo "APK CREATED SUCCESSFULLY"
          ls -lh build/Turbo3DRacing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-3D-Racing-APK
          path: build/Turbo3DRacing.apk
          if-no-files-found: error
          retention-days: 30
