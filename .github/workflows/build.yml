name: Build 3D Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Templates, Keystore & Editor Settings
        run: |
          mkdir -p /github/home/.local/share/godot
          cp -r /root/.local/share/godot/export_templates /github/home/.local/share/godot/
          
          mkdir -p /github/home/.android
          keytool -genkey -v -keystore /github/home/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          mkdir -p /github/home/.config/godot
          cat <<EOF > /github/home/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/github/home/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Project Assets
        run: |
          godot --headless --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Turbo3DRacing.apk

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-3D-Racing-APK
          path: build/Turbo3DRacing.apk
          retention-days: 30
          
