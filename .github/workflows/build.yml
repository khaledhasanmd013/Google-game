name: Build Turbo 3D Racing Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Setup Godot 4.2.2
        run: |
          mkdir -p "$HOME/godot"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip" \
            -o godot.zip

          unzip -oq godot.zip -d "$HOME/godot"

          chmod +x "$HOME/godot/Godot_v4.2.2-stable_linux.x86_64"

          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install Godot Android Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.2.stable"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -oq templates.tpz -d templates

          cp -a templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.2.2.stable/"

          test -f "$HOME/.local/share/godot/export_templates/4.2.2.stable/android_debug.apk"

      - name: Setup Android Environment
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$JAVA_HOME/bin/java"

      - name: Import Godot Project
        run: |
          godot --headless --editor --path . --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build

          godot --headless --verbose \
            --path . \
            --export-debug "Android" \
            build/Turbo3DRacing.apk

          test -s build/Turbo3DRacing.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-3D-Racing-APK
          path: build/Turbo3DRacing.apk
          retention-days: 30
